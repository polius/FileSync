# Real client IP. The stack runs behind Caddy (or another reverse proxy) on a private Docker
# network, so a hop from a private/loopback address is trusted to report the client in
# X-Forwarded-For; recursive mode walks past any further trusted hops to the first public
# address. Assumption: nothing untrusted can reach nginx from these ranges. If port 80 is
# published straight onto a LAN, LAN clients could spoof their address (only their own
# rate-limit key; it grants nothing else).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client limits on WebSocket upgrades. A page holds one socket and reconnects with
# backoff, so these only bite on floods; burst/conn headroom covers several tabs and
# devices sharing one NAT address. The backend enforces its own per-socket message limits.
limit_req_zone $binary_remote_addr zone=ws:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=wsconn:10m;

# Text assets compress well (app JS/CSS are unminified). gzip_vary is already on in
# Alpine's nginx.conf (repeating it is a duplicate-directive error). gzip_proxied any:
# requests arrive through Caddy, and Vary keeps shared caches correct.
gzip on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

# Cache policy. index.html/sw.js stamp the release into ?v= on asset URLs, so a versioned
# request is immutable. Unversioned HTML/JS/CSS get 'no-cache' (ETag revalidation, 304 when
# unchanged) so users pick up new releases immediately; unversioned fonts/images rarely
# change and get a week. sw.js is always revalidated (a stale worker pins the old release).
# Errors are never cached, so a file added later isn't masked by a cached 404.
# The maps feed the single server-level add_header below — an add_header inside a location
# would drop the inherited security headers.
map $uri $cache_unversioned {
    default                                     "no-cache";
    ~*\.(?:woff2?|png|jpe?g|gif|svg|ico|webp)$  "public, max-age=604800";
}
map $arg_v $cache_by_version {
    ""      $cache_unversioned;
    default "public, max-age=31536000, immutable";
}
map $uri $cache_by_uri {
    default  $cache_by_version;
    /sw.js   "no-cache";
}
map $status $cache_control {
    default  "no-cache";
    200      $cache_by_uri;
    206      $cache_by_uri;
    304      $cache_by_uri;
}

server {
    listen 80;
    server_tokens off;

    # To the container's stdout/stderr; the Alpine default writes unbounded files instead.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Serve web static files
    root /filesync/web;
    index index.html;

    # Security headers. script-src/style-src are 'self' only: every script and stylesheet
    # is an external file, event handlers are bound via addEventListener and styling lives
    # in classes — nothing may rely on inline <script>/<style>, onclick or style="".
    # img-src allows data: (thumbnails) and blob: (previews of received files).
    # connect-src 'self' covers the same-origin ws(s) signaling (CSP does not govern ICE).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control always;

    # Container healthcheck: one request that proves nginx and the backend both serve.
    # Unlogged, so the 30 s probe doesn't flood the access log.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    # Proxy /api/ requests to FastAPI. X-Forwarded-For carries the real client address
    # resolved above (not the client-supplied chain), which uvicorn trusts from loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /ws WebSocket signaling to FastAPI
    location /ws {
        limit_req zone=ws burst=20 nodelay;
        limit_conn wsconn 50;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle signaling sockets alive — clients ping every 10s but proxies often
        # kill idle TCP at 60s by default.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # The app shell: only `/` and room links (/abc-defg-hij) get index.html.
    location = / {
        try_files /index.html =404;
    }
    location ~ "^/[a-z]{3}-[a-z]{4}-[a-z]{3}$" {
        try_files /index.html =404;
    }

    # Alpine's mime.types lacks .webmanifest (it would be served as octet-stream).
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Everything else is a real file or a real 404 (no HTML fallback for missing assets).
    location / {
        try_files $uri =404;
    }
}
