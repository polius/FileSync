name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Builds the image, then scans it for unfixed CRITICAL vulnerabilities.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t filesync:ci .
      - name: Scan image (CRITICAL, fixed-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: filesync:ci
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  # Backend deps, import check, tests with coverage, pip-audit.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r api/requirements.txt pytest pytest-cov pip-audit
      - run: pip-audit -r api/requirements.txt
      - env:
          SECRET_KEY: ci-not-a-real-secret
        run: python -c "import api.main, api.signaling; print('import OK')"
      - run: python -m pytest tests -q --cov=api --cov-report=term-missing

  # Static analysis + JS unit tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check api tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage

  # End-to-end smoke: real Chromium pair exchanging a 100 MB file through the actual
  # container (nginx + FastAPI signaling), verified by SHA-256. Uses the exact compose
  # topology users deploy with, only swapping in a locally built image.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and start stack
        run: |
          # Tag :latest so `docker compose up` below uses this build instead of
          # pulling the released image from Docker Hub. Never pushed.
          docker build -t poliuscorp/filesync:latest .
          docker compose -f deploy/docker-compose.yml up -d --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run smoke cell (chromium / sw sink / auto ICE)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node run.mjs --smoke --base-url=http://localhost --size=20M
      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
