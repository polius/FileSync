name: Release

on:
  release:
    types: [published]

jobs:
  # Releases can be cut from any ref, so gate publishing on the tests.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r api/requirements.txt pytest ruff
      - run: ruff check api tests
      - env:
          SECRET_KEY: ci-not-a-real-secret
        run: python -c "import api.main, api.signaling; print('import OK')"
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: poliuscorp
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Derive version tag from the git ref
        id: tag
        run: |
          # Strip a leading "v" and an optional "." so both v4.0.0 and v.4.0.0 -> 4.0.0.
          SHORT_TAG="${GITHUB_REF_NAME#v}"
          SHORT_TAG="${SHORT_TAG#.}"
          echo "short_tag=$SHORT_TAG" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: poliuscorp/filesync
          # Do not move the `latest` tag for a pre-release.
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.short_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/poliuscorp/filesync
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
