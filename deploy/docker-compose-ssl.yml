services:
  caddy:
    image: caddy
    container_name: filesync-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - filesync:/data
    depends_on:
      - filesync
    restart: unless-stopped

  filesync:
    image: poliuscorp/filesync
    container_name: filesync-app
    environment:
      - SECRET_FILE=/keys/secret
    volumes:
      - keys:/keys:ro
    depends_on:
      coturn:
        condition: service_started
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  coturn:
    image: coturn/coturn:alpine
    container_name: filesync-coturn
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        secret=$$(cat /keys/secret) && exec turnserver \
          --fingerprint \
          --use-auth-secret \
          --no-multicast-peers \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --no-cli \
          --realm=filesync.app \
          --static-auth-secret="$$secret" \
          --listening-port=3478 \
          --min-port=50000 \
          --max-port=50100
    volumes:
      - keys:/keys:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped

  init:
    image: poliuscorp/filesync
    container_name: filesync-init
    command: python3 api/init_secret.py
    volumes:
      - keys:/keys

volumes:
  filesync:
  keys:
