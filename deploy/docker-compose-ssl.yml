# TLS topology: Caddy terminates HTTPS and proxies to the FileSync stack over the compose
# network. See docker-compose.yml for the plain-HTTP topology; the service definitions
# below are kept in sync with it (coturn flags are shared via coturn-entrypoint.sh).

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    # Pinned: third-party image terminating TLS.
    image: caddy:2.11.7-alpine
    container_name: filesync-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - filesync:/data
    depends_on:
      - filesync
    restart: unless-stopped
    <<: *hardening

  filesync:
    # The project's own image, built and attested by .github/workflows/release.yml.
    # Pin a released version or digest for a frozen production artifact.
    image: poliuscorp/filesync
    container_name: filesync-app
    environment:
      - SECRET_FILE=/keys/secret
    volumes:
      - keys:/keys:ro
    depends_on:
      coturn:
        condition: service_started
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
          pids: 512
    <<: *hardening

  coturn:
    # Pinned: third-party image sitting directly on the media path.
    image: coturn/coturn:4.18.0-alpine
    container_name: filesync-coturn
    # Flags shared with docker-compose.yml via this script.
    entrypoint: ["/bin/sh", "/coturn-entrypoint.sh"]
    volumes:
      - keys:/keys:ro
      - ./coturn-entrypoint.sh:/coturn-entrypoint.sh:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256
    <<: *hardening

  init:
    image: poliuscorp/filesync
    container_name: filesync-init
    command: python3 api/init_secret.py
    volumes:
      - keys:/keys
    <<: *hardening

volumes:
  filesync:
  keys:
