# TLS topology: Caddy terminates HTTPS and proxies to the stack. Kept in sync with
# docker-compose.yml.

services:
  caddy:
    # Pinned: third-party image terminating TLS.
    image: caddy:2.11.7-alpine
    container_name: filesync-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - filesync:/data
    depends_on:
      - filesync
    restart: unless-stopped

  filesync:
    # The project's own image, built and attested by .github/workflows/release.yml.
    # Pin a released version or digest for a frozen production artifact.
    image: poliuscorp/filesync
    container_name: filesync-app
    environment:
      - SECRET_FILE=/keys/secret
    volumes:
      - keys:/keys:ro
    depends_on:
      coturn:
        condition: service_started
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  coturn:
    # Pinned: third-party image sitting directly on the media path.
    image: coturn/coturn:4.18.0-alpine
    container_name: filesync-coturn
    # Same flag list as docker-compose.yml; the image entrypoint evaluates the
    # `$(...)` below against the mounted keys volume.
    command:
      - --fingerprint
      - --use-auth-secret
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --no-cli
      - --realm=filesync.app
      - --static-auth-secret=$$(cat /keys/secret)
      - --listening-port=3478
      - --min-port=50000
      - --max-port=50100
    volumes:
      - keys:/keys:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped

  init:
    image: poliuscorp/filesync
    container_name: filesync-init
    command: python3 api/init_secret.py
    volumes:
      - keys:/keys

volumes:
  filesync:
  keys:
