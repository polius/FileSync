# Optional override: TURN over TLS (turns:), for clients on networks that only allow
# outbound TLS. Layer it on either stack:
#
#   docker compose -f docker-compose-ssl.yml -f docker-compose.turns.yml up -d
#
# Needs a certificate for the TURN hostname in ./certs/fullchain.pem and ./certs/privkey.pem
# (e.g. copied from Caddy's caddy_data volume or issued by certbot; renewals need a coturn
# restart). coturn runs as nobody (uid 65534), so the key must be readable by that user:
#   chmod 644 certs/privkey.pem   (or: chown 65534 certs/privkey.pem && chmod 600 ...)
#
# Port 5349 is the TURNS default. Strict firewalls often pass only 443, which Caddy already
# holds; with a second public IP, publish "<second-ip>:443:5349" instead and set
# TURNS_PORT=443 below.

services:
  coturn:
    environment:
      # Replaces --no-tls in the base command (see the comment there).
      - TURN_TLS_ARGS=--cert=/certs/fullchain.pem --pkey=/certs/privkey.pem --tls-listening-port=5349
    volumes:
      - ./certs:/certs:ro
    ports:
      - "5349:5349/tcp"

  filesync:
    environment:
      # Advertise turns: to clients alongside the plain TURN URLs.
      - TURNS_PORT=5349
