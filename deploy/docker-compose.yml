# Shared hardening: no privilege escalation, bounded container logs (json-file is
# unbounded by default).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  filesync:
    # Built and published by release.yml. Pin a version/digest for production.
    image: poliuscorp/filesync
    container_name: filesync-app
    environment:
      - SECRET_FILE=/keys/secret
    volumes:
      - keys:/keys:ro
    ports:
      - "80:80"
    depends_on:
      coturn:
        condition: service_started
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
          pids: 512
    <<: *hardening

  coturn:
    # Pinned: third-party image sitting directly on the media path.
    image: coturn/coturn:4.18.0-alpine
    container_name: filesync-coturn
    # All turnserver flags live in the shared script (see deploy/coturn-entrypoint.sh),
    # so this file and docker-compose-ssl.yml cannot diverge.
    entrypoint: ["/bin/sh", "/coturn-entrypoint.sh"]
    volumes:
      - keys:/keys:ro
      - ./coturn-entrypoint.sh:/coturn-entrypoint.sh:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256
    <<: *hardening

  init:
    image: poliuscorp/filesync
    container_name: filesync-init
    command: python3 api/init_secret.py
    volumes:
      - keys:/keys
    <<: *hardening

volumes:
  keys:
